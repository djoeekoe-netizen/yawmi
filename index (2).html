function setH(k,v){E[k]=+v||0;const g=hij2g(E.hy,E.hm,E.hd);if(g)E.d=g;const l=$('#hjl');if(l)l.textContent=g?fmt(pd(g),'gregory',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'هذا اليوم غير موجود في الشهر الهجري'}
function chipsK(){return EK.map(k=>`<span class="chip" style="${E.k===k[0]?'background:'+k[2]+';color:#121212':''}" onclick="E.k='${k[0]}';E.kM=1;if(!YK.includes(E.k))E.y='';else if(E.k==='bday'&&!E.y)E.y='g';drawEv()">${k[1]}</span>`).join('')}
function autoK(){if(E.kM)return;const m=[['bday',/ميلاد|birthday/i],['meeting',/اجتماع|meeting|مقابلة|لقاء/i],['appt',/موعد|دكتور|طبيب|عيادة|مستشفى|appointment|doctor/i],['holiday',/عيد|إجازة|اجازة|holiday/i],['occ',/زواج|عرس|حفل|تخرج|خطوبة|عزيمة|party|wedding/i]],f=m.find(x=>x[1].test(E.t)),k=f?f[0]:'meeting';
if(k!==E.k){E.k=k;if(k==='bday')E.y='g';else if(!YK.includes(k))E.y='';if(E.more){drawEv();const i=$('#et');i.focus();i.setSelectionRange(i.value.length,i.value.length)}}}
function drawEv(){const first=$('#sheet').hidden,qm=E.pick?null:qd.find(q=>E.d===dk(addD(new Date(),q[0]))),showD=E.pick||!qm;
$('#sheet').hidden=false;$('#sheet').innerHTML=`<div class="${first?'an':''}"><div class="grab"></div><div class="stl">${E._new?'حدث جديد':'تعديل الحدث'}</div>
<input class="ttl" id="et" placeholder="وش الحدث؟" value="${esc(E.t)}" oninput="E.t=this.value;autoK()">
<div class="chips">${qd.map(q=>`<span class="chip ${qm&&qm[0]===q[0]?'on':''}" onclick="E.d=dk(addD(new Date(),${q[0]}));E.pick=0;drawEv()">${q[1]}</span>`).join('')}<span class="chip ${showD?'on':''}" onclick="E.pick=1;drawEv()">تاريخ آخر</span></div>
${showD?`<div class="seg rv"><button class="${E.cal==='h'?'':'on'}" onclick="E.cal='g';drawEv()">ميلادي</button><button class="${E.cal==='h'?'on':''}" onclick="setCalH()">هجري</button></div>${E.cal==='h'?hijriPick():`<input type="date" class="dt" value="${E.d}" oninput="E.d=this.value;$('#hjl').textContent=hjf(E.d)">`}`:''}
<div class="sub" id="hjl" style="margin:4px 6px">${showD&&E.cal==='h'?fmt(pd(E.d),'gregory',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):hjf(E.d)}</div>
<button class="lnk" onclick="E.more=!E.more;drawEv()">${E.more?'إخفاء الخيارات':'المزيد من الخيارات'}</button>
${E.more?`<div class="fl">النوع</div><div class="chips">${chipsK()}</div><div class="fl">الوقت</div><input type="time" class="dt" value="${E.tm}" oninput="E.tm=this.value">${YK.includes(E.k)?`<div class="fl">التكرار</div><div class="seg rv"><button class="${E.y?'':'on'}" onclick="E.y='';drawEv()">مرة واحدة</button><button class="${E.y==='g'?'on':''}" onclick="E.y='g';drawEv()">سنوي ميلادي</button><button class="${E.y==='h'?'on':''}" onclick="E.y='h';drawEv()">سنوي هجري</button></div>`:''}<textarea placeholder="ملاحظة (اختياري)" oninput="E.n=this.value" style="min-height:64px;margin-top:10px">${esc(E.n)}</textarea>`:''}
<div class="acts"><button class="btn p" onclick="saveEv()">حفظ</button>${E._new?'':'<button class="btn d" onclick="delEv()">حذف</button>'}</div></div>`}
function saveEv(){if(!E.t.trim())return $('#et').focus();if(!E.d)return toast('اختر التاريخ');const o={...E};delete o._new;o.t=o.t.trim();delete o.more;delete o.pick;delete o.kM;delete o.cal;delete o.hy;delete o.hm;delete o.hd;const i=S.events.findIndex(x=>x.id===o.id);i<0?S.events.push(o):S.events[i]=o;save();shut();render()}
let CB=null;
function ask(msg,fn){CB=fn;const f=$('#sheet').hidden;$('#sheet').hidden=false;$('#sheet').innerHTML=`<div class="${f?'an':''}"><div class="grab"></div><div class="stl">${msg}</div><div class="acts"><button class="btn d" onclick="const f=CB;shut();if(f)f()">نعم، احذف</button><button class="btn p" onclick="shut()">إلغاء</button></div></div>`}
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.className='show';clearTimeout(t._t);t._t=setTimeout(()=>{t.className=''},2200)}
function delEv(){const id=E.id;ask('حذف هذا الحدث؟',()=>{S.events=S.events.filter(x=>x.id!==id);save();render()})}
function delMemo(){const id=E.id;ask('حذف هذه الملاحظة؟',()=>{S.memos=S.memos.filter(m=>m.id!==id);save();render()})}
function openItem(id){const it=S.items.find(i=>i.id===id);E=it?{...it,days:[...(it.days||[])]}:{id:uid(),type:'habit',name:'',period:'once',days:[],target:'',unit:'',goal:'',star:false,created:dk(new Date()),_new:true};drawItem()}
function drawItem(){const h=E.type==='habit',first=$('#sheet').hidden,md=E.mode||(E.every>1?'every':E.days.length?'days':'daily');$('#sheet').hidden=false;$('#sheet').innerHTML=`<div class="${first?'an':''}"><div class="grab"></div><div class="stl">${E._new?'عنصر جديد':'تعديل'}</div>${E._new?'<button class="lnk" style="margin-top:-10px" onclick="openTpl()">قوالب جاهزة</button>':''}
<input class="ttl" id="nm" placeholder="${h?'اسم العادة':'اسم المهمة'}" value="${esc(E.name)}" oninput="E.name=this.value">
<div class="seg"><button class="${h?'on':''}" onclick="E.type='habit';drawItem()">عادة</button><button class="${h?'':'on'}" onclick="E.type='task';drawItem()">مهمة</button></div>
${h?`<div class="fl">التكرار</div><div class="seg">${[['daily','كل يوم'],['days','أيام محددة'],['every','كل عدة أيام']].map(m=>`<button class="${md===m[0]?'on':''}" onclick="setMode('${m[0]}')">${m[1]}</button>`).join('')}</div>${md==='days'?`<div class="days">${DN.map((d,i)=>`<span class="dd ${E.days.includes(i)?'on':''}" onclick="tgDay(${i})">${d}</span>`).join('')}</div>`:''}${md==='every'?`<div class="chips">${[2,3,4,7].map(n=>`<span class="chip ${E.every===n?'on':''}" onclick="E.every=${n};drawItem()">${n===2?'يوم ويوم لا':'كل '+n+' أيام'}</span>`).join('')}</div>${E._new?`<div class="fl">يبدأ</div><div class="seg"><button class="${E.startOff?'':'on'}" onclick="E.startOff=0;drawItem()">من اليوم</button><button class="${E.startOff?'on':''}" onclick="E.startOff=1;drawItem()">من بكرة</button></div>`:''}`:''}
<div class="fl">قياس رقمي (اختياري)</div><div class="two"><input type="number" inputmode="numeric" placeholder="الهدف: 10" value="${E.target}" oninput="E.target=+this.value||''"><input placeholder="الوحدة: صفحة" value="${esc(E.unit)}" oninput="E.unit=this.value"></div><div class="fl">وقت اليوم</div><div class="chips">${[['','أي وقت'],['m','الصباح'],['n','الظهيرة'],['e','المساء']].map(v=>`<span class="chip ${(E.tod||'')===v[0]?'on':''}" onclick="E.tod='${v[0]}';drawItem()">${v[1]}</span>`).join('')}</div>`
:`<div class="fl">التكرار</div><div class="chips">${[['once','مرة واحدة'],['day','يومي'],['week','أسبوعي'],['month','شهري'],['year','سنوي']].map(p=>`<span class="chip ${E.period===p[0]?'on':''}" onclick="E.period='${p[0]}';drawItem()">${p[1]}</span>`).join('')}</div><div class="fl">${E.period==='once'?'كم مرة تحتاج تنجزها؟':'كم مرة في '+({day:'اليوم',week:'الأسبوع',month:'الشهر',year:'السنة'})[E.period]+'؟'}</div><div class="st"><button class="mn" onclick="E.times=Math.max(1,(E.times||1)-1);drawItem()">−</button><b>${E.times||1}<small>مرة</small></b><button class="pl" onclick="E.times=Math.min(99,(E.times||1)+1);drawItem()">+</button></div>`}
${S.goals.length?`<div class="fl">الهدف المرتبط</div><div class="chips"><span class="chip ${E.goal?'':'on'}" onclick="E.goal='';drawItem()">بدون</span>${S.goals.map(g=>`<span class="chip ${E.goal===g.id?'on':''}" onclick="E.goal='${g.id}';drawItem()">${esc(g.title)}</span>`).join('')}</div>`:''}
<div class="sw" style="margin-top:10px;border:0"><span>★ أساسي (يظهر في يوم صعب)</span><span class="tg ${E.star?'on':''}" onclick="E.star=!E.star;drawItem()"></span></div>${E._new?'':`<div class="sw" style="border:0"><span>إيقاف مؤقت</span><span class="tg ${E.paused?'on':''}" onclick="E.paused=!E.paused;drawItem()"></span></div>`}
<div class="acts"><button class="btn p" onclick="saveItem()">حفظ</button>${E._new?'':'<button class="btn d" onclick="delItem()">حذف</button>'}</div></div>`}
function setMode(m){E.mode=m;if(m==='daily'){E.days=[];E.every=0}if(m==='days')E.every=0;if(m==='every'){E.days=[];if(!(E.every>1))E.every=2}drawItem()}
function tgDay(i){const k=E.days.indexOf(i);k<0?E.days.push(i):E.days.splice(k,1);drawItem()}
function saveItem(){if(!E.name.trim())return $('#nm').focus();const o={...E};if(E.every>1&&E._new){o.start=dk(addD(new Date(),E.startOff||0));o.created=o.start}delete o._new;delete o.mode;delete o.startOff;o.name=o.name.trim();if(o.type==='task'){o.days=[];o.target='';o.unit='';o.every=0;o.times=o.times||1}else o.period='day';if(o.every>1){if(!o.start)o.start=o.created}else{o.every=0;delete o.start}
const i=S.items.findIndex(x=>x.id===o.id);i<0?S.items.push(o):S.items[i]=o;save();shut();render()}
function delItem(){S.items=S.items.filter(i=>i.id!==E.id);delete S.logs[E.id];save();shut();render()}
function openGoal(id){const g=S.goals.find(x=>x.id===id);E=g?{...g}:{id:uid(),title:'',period:'month',target:10,_new:true};drawGoal()}
function drawGoal(){const first=$('#sheet').hidden;$('#sheet').hidden=false;$('#sheet').innerHTML=`<div class="${first?'an':''}"><div class="grab"></div><div class="stl">${E._new?'هدف جديد':'تعديل الهدف'}</div>
<input class="ttl" id="gt" placeholder="مثال: قراءة 24 كتاب" value="${esc(E.title)}" oninput="E.title=this.value">
<div class="fl">المدة</div><div class="seg">${['year','month','week'].map(p=>`<button class="${E.period===p?'on':''}" onclick="E.period='${p}';drawGoal()">${PN[p]}</button>`).join('')}</div>
<div class="fl">المطلوب (عدد مرات إنجاز العناصر المرتبطة)</div><input type="number" inputmode="numeric" value="${E.target}" oninput="E.target=Math.max(1,+this.value||1)">
<div class="acts"><button class="btn p" onclick="saveGoal()">حفظ</button>${E._new?'':'<button class="btn d" onclick="delGoal()">حذف</button>'}</div></div>`}
function saveGoal(){if(!E.title.trim())return $('#gt').focus();const o={...E};delete o._new;o.title=o.title.trim();const i=S.goals.findIndex(x=>x.id===o.id);i<0?S.goals.push(o):S.goals[i]=o;save();shut();render()}
function delGoal(){S.goals=S.goals.filter(g=>g.id!==E.id);S.items.forEach(i=>{if(i.goal===E.id)i.goal=''});save();shut();render()}
$('#sheet').onclick=e=>{if(e.target.id==='sheet')shut()};applyLang();render();
</script>
</body>
</html>
